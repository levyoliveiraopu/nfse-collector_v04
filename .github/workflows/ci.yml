name: ci

# Lint + test base para todo PR e push em main.
# Ver docs/tasks/GOV-06.md.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: Run ruff check
        run: ruff check .

  test-python:
    name: Test Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
            packages/worker-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/worker-core
          pip install -e "apps/api[dev]"
          pip install -e "apps/worker[dev]"

      - name: Run pytest
        run: pytest tests apps/api/tests apps/worker/tests -v

  lint-ts:
    name: Lint TS (eslint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (web-app)
        run: pnpm --filter web-app lint

      - name: Typecheck (web-app)
        run: pnpm --filter web-app typecheck

      - name: Vitest (web-app)
        run: pnpm --filter web-app test

  test-rls:
    name: Test RLS isolation (DATA-06)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nfse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nfse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nfse_test
      API_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nfse_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
            packages/worker-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/worker-core
          pip install -e "apps/api[dev]"

      - name: Apply Alembic migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run RLS isolation tests
        working-directory: apps/api
        run: pytest tests/test_rls_isolation.py -v
