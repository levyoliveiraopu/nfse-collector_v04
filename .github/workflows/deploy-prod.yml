name: deploy-prod

# INFRA-09 — deploy prod acionado por push de tag `v*`.
#
# Para promover uma release:
#   git tag v0.0.1 && git push origin v0.0.1
#
# Fluxo:
#   1. `build-push`: build do `apps/api/Dockerfile` e push para GHCR com
#      as tags `<git-tag>` (ex: `v0.0.1`) e `latest-prod`.
#   2. `deploy`: conecta via SSH no VPS, exporta `DEPLOY_TAG=<git-tag>`
#      e roda `/srv/nfse/deploy.sh` (env=prod) — pull/up/health/rollback.
#
# Secrets iguais ao deploy-staging (SSH_HOST/SSH_USER/SSH_KEY; GHCR_TOKEN
# opcional na VPS para `docker login`).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag a deployar (ex: v0.0.1)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: nfse-api

jobs:
  build-push:
    name: Build e push da imagem da API (GHCR)
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Em push de tag, garante o checkout na ref da tag (default ok,
          # mas explicitamos para o workflow_dispatch manual tambem).
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Metadata da imagem
        id: meta
        run: |
          # Em push de tag, github.ref = refs/tags/v0.0.1 -> strip para v0.0.1.
          # Em dispatch manual, pega o input.
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            deploy_tag="${{ github.event.inputs.tag }}"
          else
            deploy_tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "${deploy_tag}" =~ ^v[0-9] ]]; then
            echo "ERRO: tag '${deploy_tag}' nao bate com o padrao v*." >&2
            exit 1
          fi
          echo "deploy_tag=${deploy_tag}" >> "$GITHUB_OUTPUT"
          echo "Deploy tag = ${deploy_tag}"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (nfse-api)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.deploy_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-prod
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nfse-api-prod
          cache-to: type=gha,scope=nfse-api-prod,mode=max

  deploy:
    name: Deploy no VPS (prod)
    needs: build-push
    runs-on: ubuntu-latest
    # Environment `prod` permite ao owner exigir approval manual no GitHub
    # antes do SSH rodar — configurado em Settings > Environments.
    environment:
      name: prod
    steps:
      - name: SSH - executa deploy.sh no VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          envs: DEPLOY_TAG
          script: |
            set -euo pipefail
            export DEPLOY_ENV=prod
            export DEPLOY_TAG="${{ needs.build-push.outputs.deploy_tag }}"
            bash /srv/nfse/deploy.sh
