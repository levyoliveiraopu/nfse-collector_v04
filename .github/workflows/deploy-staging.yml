name: deploy-staging

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/web-app/**'
      - 'packages/worker-core/**'
      - 'infra/compose/**'
      - 'infra/deploy/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    name: Build e push das imagens (GHCR)
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metadata da release
        id: meta
        run: |
          deploy_tag="sha-${GITHUB_SHA::7}"
          echo "deploy_tag=${deploy_tag}" >> "$GITHUB_OUTPUT"
          echo "Deploy tag = ${deploy_tag}"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (nfse-api)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/nfse-api:${{ steps.meta.outputs.deploy_tag }}
            ${{ env.IMAGE_REGISTRY }}/nfse-api:latest-staging
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nfse-api-staging
          cache-to: type=gha,scope=nfse-api-staging,mode=max

      - name: Build e push (nfse-worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/nfse-worker:${{ steps.meta.outputs.deploy_tag }}
            ${{ env.IMAGE_REGISTRY }}/nfse-worker:latest-staging
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nfse-worker-staging
          cache-to: type=gha,scope=nfse-worker-staging,mode=max

      - name: Build e push (nfse-web-app)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/nfse-web-app:${{ steps.meta.outputs.deploy_tag }}
            ${{ env.IMAGE_REGISTRY }}/nfse-web-app:latest-staging
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || '/api' }}
          cache-from: type=gha,scope=nfse-web-app-staging
          cache-to: type=gha,scope=nfse-web-app-staging,mode=max

  deploy:
    name: Deploy no VPS (staging)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH - executa deploy.sh no VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          envs: DEPLOY_TAG
          script: |
            set -euo pipefail
            export DEPLOY_ENV=staging
            export DEPLOY_TAG="${{ needs.build-push.outputs.deploy_tag }}"
            bash /srv/nfse/deploy.sh
