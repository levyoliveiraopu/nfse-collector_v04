name: deploy-staging

# INFRA-09 — deploy staging automatico ao mergear em `main`.
#
# Fluxo:
#   1. `build-push`: build multi-stage do `apps/api/Dockerfile` e push
#      para GHCR com as tags `sha-<sha>` e `latest-staging`.
#   2. `deploy`: conecta via SSH no VPS, exporta `DEPLOY_TAG=sha-<sha>`
#      e roda `/srv/nfse/deploy.sh` — que faz pull/up/health/rollback.
#
# Worker (`packages/worker-core`) fica fora ate CORE-05 publicar a imagem
# `nfse-worker`. O esqueleto ja esta em `infra/compose/docker-compose.deploy.yml`.
#
# Secrets necessarios no repo:
#   SSH_HOST  — IP/host do VPS
#   SSH_USER  — usuario `deploy` (INFRA-01)
#   SSH_KEY   — chave privada SSH (sem passphrase), par publico em ~deploy/.ssh/authorized_keys
#   GHCR_TOKEN (opcional) — PAT com scope `read:packages` para `docker login` na VPS.
#                           O push para GHCR usa `GITHUB_TOKEN` nativo.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/worker-core/**'
      - 'infra/compose/**'
      - 'infra/deploy/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  # Serializa deploys em staging — um deploy em voo nao e interrompido,
  # mas um novo deploy espera terminar.
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: nfse-api

jobs:
  build-push:
    name: Build e push da imagem da API (GHCR)
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metadata da imagem
        id: meta
        run: |
          deploy_tag="sha-${GITHUB_SHA::7}"
          echo "deploy_tag=${deploy_tag}" >> "$GITHUB_OUTPUT"
          echo "Deploy tag = ${deploy_tag}"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (nfse-api)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.deploy_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-staging
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nfse-api-staging
          cache-to: type=gha,scope=nfse-api-staging,mode=max

  deploy:
    name: Deploy no VPS (staging)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH - executa deploy.sh no VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # `script_stop: true` faz o runner falhar se qualquer comando
          # remoto retornar != 0 (inclui exit 20 do deploy.sh em rollback).
          script_stop: true
          # `envs:` passa variaveis locais do GH Actions para o shell remoto.
          envs: DEPLOY_TAG
          script: |
            set -euo pipefail
            export DEPLOY_ENV=staging
            export DEPLOY_TAG="${{ needs.build-push.outputs.deploy_tag }}"
            bash /srv/nfse/deploy.sh
