# Configuracao do Alembic para apps/api (DATA-01).
#
# A URL de conexao e resolvida dinamicamente em alembic/env.py a partir de
# API_DATABASE_URL (pydantic-settings). Por isso a chave `sqlalchemy.url`
# abaixo e vazia: nao ha segredo em arquivo.

[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
