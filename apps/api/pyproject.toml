[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nfse-api"
version = "0.1.0"
description = "API FastAPI do SaaS NFS-e (endpoints publicos, autenticacao, orquestracao de workers)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Levy Oliveira" },
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "python-json-logger>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "slowapi>=0.1.9",
    "cryptography>=42.0",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.hatch.build.targets.sdist]
include = [
    "api",
    "README.md",
    "pyproject.toml",
]
