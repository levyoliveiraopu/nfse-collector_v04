# Compose override — SELF-HOST em uma unica VM (ex: Oracle Cloud Always Free).
#
# Diferente do docker-compose.deploy.yml (que puxa imagens prontas do GHCR),
# este arquivo CONSTROI as imagens na propria VM a partir do codigo-fonte e
# adiciona tudo o que falta para o sistema rodar 100% sozinho, sem nenhum
# servico externo pago:
#   - minio       -> storage S3-compativel local (substitui Backblaze B2)
#   - minio-init  -> cria o bucket no primeiro boot
#   - caddy       -> proxy reverso com HTTPS automatico (Let's Encrypt)
#
# Uso (junto com a base que sobe Postgres + Redis):
#   docker compose --env-file .env \
#     -f docker-compose.base.yml -f docker-compose.selfhost.yml build
#   docker compose --env-file .env \
#     -f docker-compose.base.yml -f docker-compose.selfhost.yml up -d
#
# Roteamento (um unico dominio):
#   https://SEU_DOMINIO/           -> painel Next.js (web-app)
#   https://SEU_DOMINIO/backend/*  -> API FastAPI    (mesma origem, sem CORS)
#   https://SEU_DOMINIO:8443/      -> MinIO (S3) para downloads pre-assinados

services:
  # ---------------------------------------------------------------------------
  # Storage S3-compativel local (MinIO) — substitui o Backblaze B2.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nfse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY_ID:?S3_KEY_ID nao definido}
      MINIO_ROOT_PASSWORD: ${S3_APPLICATION_KEY:?S3_APPLICATION_KEY nao definido}
      # URL publica: MinIO valida as assinaturas pre-assinadas contra ela.
      MINIO_SERVER_URL: ${S3_ENDPOINT:?S3_ENDPOINT nao definido}
    volumes:
      - miniodata:/data
    ports:
      # Console de admin apenas em loopback (acesse via tunel SSH).
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Cria o bucket no primeiro boot (idempotente).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nfse-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET nao definido}
      S3_KEY_ID: ${S3_KEY_ID}
      S3_APPLICATION_KEY: ${S3_APPLICATION_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_KEY_ID\" \"$$S3_APPLICATION_KEY\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      echo 'bucket pronto: '\"$$S3_BUCKET\"
      "
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Migrations (Alembic) — roda uma vez e sai.
  # ---------------------------------------------------------------------------
  migrate:
    image: nfse-api:selfhost
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: nfse-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    command: ["alembic", "upgrade", "head"]
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # API FastAPI
  # ---------------------------------------------------------------------------
  api:
    image: nfse-api:selfhost
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: nfse-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Worker RQ (coleta NFS-e)
  # ---------------------------------------------------------------------------
  worker:
    image: nfse-worker:selfhost
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: nfse-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      WORKER_HEALTHZ_PORT: ${WORKER_HEALTHZ_PORT:-8080}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Scheduler APScheduler (dispara coletas cron)
  # ---------------------------------------------------------------------------
  scheduler:
    image: nfse-worker:selfhost
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: nfse-scheduler
    command: ["python", "-m", "worker.scheduler"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SCHEDULER_HEALTHZ_PORT: ${SCHEDULER_HEALTHZ_PORT:-8081}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # Painel Next.js
  # ---------------------------------------------------------------------------
  web-app:
    image: nfse-web-app:selfhost
    build:
      context: ../..
      dockerfile: apps/web-app/Dockerfile
      args:
        # Injetado no bundle do browser em tempo de BUILD. Aponta para a API
        # na mesma origem (/backend) para nao precisar de CORS.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL nao definido}
    container_name: nfse-web-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      # Chamadas server-side (BFF de auth) usam a rede interna: mais rapido
      # e nao passa pelo proxy publico.
      API_BASE_URL: http://api:8000
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Caddy — proxy reverso + HTTPS automatico (Let's Encrypt).
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: nfse-caddy
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_started
      api:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "${S3_PUBLIC_PORT:-8443}:8443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN nao definido}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL nao definido}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-8443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - internal

volumes:
  miniodata:
    name: nfse_miniodata
  caddydata:
    name: nfse_caddydata
  caddyconfig:
    name: nfse_caddyconfig

networks:
  internal:
    name: nfse_internal
