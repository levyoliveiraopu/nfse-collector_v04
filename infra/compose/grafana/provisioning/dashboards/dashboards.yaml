# Grafana dashboard provisioning (INFRA-07).
# Carrega todo .json sob /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: nfse
    orgId: 1
    folder: NFS-e
    folderUid: nfse
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
