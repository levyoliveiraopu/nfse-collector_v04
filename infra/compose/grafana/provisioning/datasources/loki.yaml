# Grafana datasource provisioning (INFRA-07).
# Loki via rede obs_net (service name "loki" resolve para o container).

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: loki
    url: http://loki:3100
    isDefault: true
    version: 1
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
