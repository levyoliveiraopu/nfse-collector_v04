# Promtail 2.9 config para INFRA-07.
# Coleta logs de containers Docker (json-file driver) em
# /var/lib/docker/containers/*/*-json.log e encaminha para Loki.
#
# Labels extraidas via pipeline a partir do path do arquivo e do JSON do
# Docker: container_name, stack, image.
# Para que os logs do API/worker apareccam com os labels corretos, os
# services nos outros compose files devem usar container_name explicito
# (ex.: nfse-api, nfse-worker) ou o label `com.docker.compose.project`
# automatico do Compose.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # -----------------------------------------------------------------
  # Docker containers (json-file log driver)
  # -----------------------------------------------------------------
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            attrs: attrs
      - json:
          source: attrs
          expressions:
            tag: tag
      # Extrai container_id do path do arquivo.
      - regex:
          source: filename
          expression: "/var/lib/docker/containers/(?P<container_id>[0-9a-f]+)/.*"
      - labels:
          stream:
          container_id:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output

    # Enriquece com o nome do container via docker_sd_configs — exige
    # socket do Docker no Promtail. Versao simples (sem docker_sd) extrai
    # o nome do container via label do Compose quando disponivel. Para
    # producao com mais fidelidade, trocar o static_configs acima por:
    #
    # docker_sd_configs:
    #   - host: unix:///var/run/docker.sock
    #     refresh_interval: 5s
    # relabel_configs:
    #   - source_labels: ['__meta_docker_container_name']
    #     regex: '/(.*)'
    #     target_label: 'container_name'
    #   - source_labels: ['__meta_docker_container_log_stream']
    #     target_label: 'stream'
    #   - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
    #     target_label: 'stack'
    #
    # Se migrar, adicione o mount
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    # no service promtail do docker-compose.obs.yml.

  # -----------------------------------------------------------------
  # Journal do host (opcional — util para debug de systemd na VPS)
  # -----------------------------------------------------------------
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: nfse-vps
          __path__: /var/log/*.log
