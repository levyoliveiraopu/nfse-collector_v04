# infra/nginx/nginx.conf (INFRA-04)
#
# Overrides recomendados para /etc/nginx/nginx.conf no servidor host da VPS.
# Este arquivo NAO substitui inteiramente o /etc/nginx/nginx.conf que vem do
# pacote `nginx` do Ubuntu 24.04 — apenas documenta os ajustes que precisam
# estar presentes. Ver `infra/nginx.md` secao 4 para o diff aplicado.
#
# Premissas:
# - Nginx 1.24+ (pacote `nginx` do Ubuntu 24.04 noble).
# - Usuario de servico `www-data`.
# - Includes de `/etc/nginx/sites-enabled/*` e `/etc/nginx/snippets/*.conf`.

# Processos = nucleos fisicos; "auto" cobre o caso.
worker_processes auto;

# Bom para proxies com muitas conexoes simultaneas.
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # --- Basico
    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     65s;
    keepalive_requests    1000;
    types_hash_max_size   2048;
    server_tokens         off;              # nao expor versao
    client_max_body_size  25m;              # upload de PFX A1 cabe com folga
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          30s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logs (formato com request_time + upstream + x-forwarded-for)
    log_format main
        '$remote_addr - $remote_user [$time_iso8601] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct="$upstream_connect_time" '
        'urt="$upstream_response_time" xfwd="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # --- Snippets compartilhados (TLS, headers, proxy, rate limit)
    # Incluir antes dos sites para que `limit_req_zone` e os `map` estejam
    # disponiveis nos server blocks.
    include /etc/nginx/snippets/connection-upgrade.conf;
    include /etc/nginx/snippets/rate-limit.conf;

    # --- Sites (cada subdominio em seu proprio arquivo)
    include /etc/nginx/sites-enabled/*.conf;
}
