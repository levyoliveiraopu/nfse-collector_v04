<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Em breve</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f17;
      color: #e6e8eb;
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 42rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      opacity: 0.75;
      line-height: 1.6;
      margin: 0.5rem 0;
    }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border: 1px solid #2a3242;
      border-radius: 999px;
      color: #9aa3b2;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">NFS-e SaaS</p>
    <h1>Em breve</h1>
    <p>Este ambiente esta sendo preparado.</p>
    <p>Em caso de duvida, fale com a administracao do seu tenant.</p>
  </main>
</body>
</html>
