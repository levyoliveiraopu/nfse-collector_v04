# infra/nginx/sites-available/apex.conf (INFRA-04)
#
# Server block para o apex (ex: ${DOMAIN}). Proxied pela Cloudflare (laranja)
# conforme INFRA-03. Redireciona tudo para `www` — simplifica TLS e evita
# manter conteudo duplicado. Placeholder "em breve" servido via `www`.
#
# Substituir `DOMAIN.EXAMPLE` pelo dominio real ao aplicar no host (o
# valor real NAO entra no repo — ver `infra/nginx.md` secao 6).

# HTTP 80 — certbot adiciona o bloco ACME e um redirect 301 para HTTPS
# automaticamente. Mantido aqui apenas para o primeiro boot antes do
# certbot rodar.
server {
    listen      80;
    listen      [::]:80;
    server_name DOMAIN.EXAMPLE;

    # ACME http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.$host$request_uri;
    }
}

# HTTPS 443 — apos `certbot --nginx`, as linhas `ssl_certificate*` ficam
# no bloco gerado pelo certbot. Este template assume emissao ja feita.
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name DOMAIN.EXAMPLE;

    # Managed by Certbot — placeholders para revisao local (nao commitar valores reais):
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Redireciona para www (canonical).
    return 301 https://www.$host$request_uri;
}
