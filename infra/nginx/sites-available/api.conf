# infra/nginx/sites-available/api.conf (INFRA-04)
#
# Server block para `api.${DOMAIN}` — FastAPI (`apps/api`).
#
# ATENCAO (ADR-003 / INFRA-03): `api` DEVE estar em DNS-only na Cloudflare
# (cinza). Se passar por proxy Cloudflare, o TLS e terminado na Cloudflare
# e o mTLS do worker contra as prefeituras (PFX A1) quebra. O cert e
# terminado aqui no Nginx host.
#
# Ate INFRA-05 subir o Compose com o container da API, servimos o
# placeholder "em breve". O `proxy_pass` esta comentado.

server {
    listen      80;
    listen      [::]:80;
    server_name api.DOMAIN.EXAMPLE;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.DOMAIN.EXAMPLE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Body maior para eventual upload de PFX A1 em /companies/credentials.
    client_max_body_size 10m;

    # --- Rate limit em /auth/* (DoD do INFRA-04)
    #
    # 5 req/s/IP sustentado, burst 10, retorno 429 quando estoura.
    # Aplica a /auth/signup, /auth/login, /auth/refresh, /auth/logout.
    # NAO aplica ao resto da API para nao impactar listagens/dashboards.
    location ^~ /auth/ {
        limit_req zone=auth_ip burst=10 nodelay;
        limit_req_status 429;

        # --- Placeholder "em breve" (ativo ate INFRA-05)
        return 503 "api em breve\n";
        add_header Content-Type text/plain always;

        # --- INFRA-05: remover o `return 503` acima e descomentar:
        # proxy_pass http://127.0.0.1:8000;
        # include snippets/proxy-common.conf;
    }

    # --- Placeholder "em breve" para o resto dos paths (ativo ate INFRA-05)
    location / {
        return 503 "api em breve\n";
        add_header Content-Type text/plain always;
    }

    # --- INFRA-05: descomentar e remover o `location /` acima quando o
    # container da API estiver publicando em 127.0.0.1:8000.
    #
    # location / {
    #     proxy_pass http://127.0.0.1:8000;
    #     include snippets/proxy-common.conf;
    # }

    # Health endpoint pode ficar sem rate limit e responder sem autenticacao.
    # location = /health {
    #     proxy_pass http://127.0.0.1:8000/health;
    #     include snippets/proxy-common.conf;
    #     access_log off;
    # }
}
