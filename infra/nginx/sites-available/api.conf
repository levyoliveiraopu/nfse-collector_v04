# infra/nginx/sites-available/api.conf
# Server block para `api.${DOMAIN}` — FastAPI.

server {
    listen      80;
    listen      [::]:80;
    server_name api.DOMAIN.EXAMPLE;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.DOMAIN.EXAMPLE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10m;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        include snippets/proxy-common.conf;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000/ready;
        include snippets/proxy-common.conf;
        access_log off;
    }

    location ^~ /auth/ {
        limit_req zone=auth_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-common.conf;
    }
}
