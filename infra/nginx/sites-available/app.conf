# infra/nginx/sites-available/app.conf
# Server block para `app.${DOMAIN}` — Next.js web-app.

server {
    listen      80;
    listen      [::]:80;
    server_name app.DOMAIN.EXAMPLE;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name app.DOMAIN.EXAMPLE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        include snippets/proxy-common.conf;
        access_log off;
    }

    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy-common.conf;
    }
}
