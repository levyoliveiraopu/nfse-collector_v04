# infra/nginx/sites-available/app.conf (INFRA-04)
#
# Server block para `app.${DOMAIN}` — painel Next.js (`apps/web-app`).
# Proxied pela Cloudflare (laranja) — ver INFRA-03.
#
# Ate INFRA-05 subir o Compose com o container do web-app, servimos o
# placeholder "em breve". O `proxy_pass` esta comentado — INFRA-05
# descomenta na entrega do Compose.

server {
    listen      80;
    listen      [::]:80;
    server_name app.DOMAIN.EXAMPLE;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name app.DOMAIN.EXAMPLE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # --- Placeholder "em breve" (ativo ate INFRA-05)
    root  /var/www/em-breve;
    index em-breve.html;

    location = / {
        try_files /em-breve.html =404;
    }

    location / {
        try_files $uri $uri/ /em-breve.html;
    }

    # --- INFRA-05: descomentar este bloco e remover os `try_files` acima
    # quando o container `web-app` estiver publicando em 127.0.0.1:3000.
    #
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     include snippets/proxy-common.conf;
    # }
    #
    # # Next.js HMR / WebSocket (dev/staging). Em prod podemos manter — o
    # # upgrade so dispara quando o cliente pede Upgrade.
    # location /_next/webpack-hmr {
    #     proxy_pass http://127.0.0.1:3000;
    #     include snippets/proxy-common.conf;
    # }
}
