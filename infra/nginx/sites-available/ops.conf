# infra/nginx/sites-available/ops.conf (INFRA-04)
#
# Server block para `ops.${DOMAIN}` — observabilidade (Grafana / Prometheus
# / Loki / Uptime Kuma, a definir em INFRA-09).
#
# ATENCAO (ADR-003 / INFRA-03): `ops` DEVE estar em DNS-only na Cloudflare
# (cinza). Rotas administrativas podem precisar de mTLS no futuro — o
# proxy Cloudflare terminaria o TLS e quebraria a handshake.
#
# Placeholder "em breve" ate INFRA-09.
#
# TODO (INFRA-09): considerar IP allowlist (UFW + `allow`/`deny` aqui) ou
# SSO via oauth2-proxy antes de abrir publicamente.

server {
    listen      80;
    listen      [::]:80;
    server_name ops.DOMAIN.EXAMPLE;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ops.DOMAIN.EXAMPLE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Sinaliza para robos que nao e pra indexar.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root  /var/www/em-breve;
    index em-breve.html;

    location = / {
        try_files /em-breve.html =404;
    }

    location / {
        try_files $uri $uri/ /em-breve.html;
    }
}
