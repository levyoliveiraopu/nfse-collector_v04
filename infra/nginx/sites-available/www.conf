# infra/nginx/sites-available/www.conf (INFRA-04)
#
# Server block para `www.${DOMAIN}`. Proxied pela Cloudflare (laranja).
# Serve o placeholder "em breve" enquanto a trilha SITE-* estiver
# bloqueada por naming. Quando SITE-01 sair, trocar `root` pelo build
# estatico do site institucional.

server {
    listen      80;
    listen      [::]:80;
    server_name www.DOMAIN.EXAMPLE;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.DOMAIN.EXAMPLE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN.EXAMPLE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN.EXAMPLE/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root  /var/www/em-breve;
    index em-breve.html;

    location = / {
        try_files /em-breve.html =404;
    }

    location / {
        try_files $uri $uri/ /em-breve.html;
    }

    # Sem index de diretorio.
    autoindex off;
}
