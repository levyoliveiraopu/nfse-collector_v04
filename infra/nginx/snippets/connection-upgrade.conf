# infra/nginx/snippets/connection-upgrade.conf (INFRA-04)
#
# Map necessario para WebSocket/SSE upgrade. DEVE ficar no bloco `http { }`
# do nginx.conf (o `include sites-enabled/*.conf` roda dentro de http, mas
# maps tambem moram la — por isso carregamos este snippet no nginx.conf
# global, acima de `include sites-enabled`).
#
# Uso referenciado em `proxy-common.conf` como `$connection_upgrade`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
