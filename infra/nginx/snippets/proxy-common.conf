# infra/nginx/snippets/proxy-common.conf (INFRA-04)
#
# Headers e timeouts comuns para reverse proxy para upstreams locais
# (Compose publicando em 127.0.0.1:<porta>). Inclua dentro dos blocos
# `location / { proxy_pass ...; include snippets/proxy-common.conf; }`.

proxy_http_version 1.1;

# Preserva o host original (necessario para o app gerar links corretos)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / HTTP upgrade (Next.js HMR em staging, SSE no painel)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts — a API FastAPI tem endpoints sincronos rapidos; o worker
# de coleta roda assincrono via RQ, entao o HTTP nao precisa esperar.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    60s;

# Buffering — off para rotas streaming (SSE), on para o resto.
# Override por `location` quando necessario.
proxy_buffering       on;
proxy_buffer_size     8k;
proxy_buffers         16 8k;
proxy_busy_buffers_size 16k;

# Nao repassar cookies do upstream para caches compartilhados.
proxy_hide_header X-Powered-By;
