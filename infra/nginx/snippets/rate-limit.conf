# infra/nginx/snippets/rate-limit.conf (INFRA-04)
#
# Rate limit basico por IP para rotas de autenticacao.
# Incluido no bloco `http { }` do nginx.conf (as zonas precisam viver ali,
# nao dentro de `server { }`).
#
# Aplicacao: no server block de `api`, usar `limit_req zone=auth_ip burst=10 nodelay;`
# dentro do `location ^~ /auth/`. Ver `sites-available/api.conf`.

# Zona `auth_ip` — 10 MB = ~160k IPs simultaneos, 5 req/s/IP.
# Curva:
#   - 5 req/s/IP sustentado
#   - burst=10 permite picos curtos (login valido em multiplas abas)
#   - nodelay para nao enfileirar a latencia
#   - retorno 429 com `Retry-After` quando estoura.
limit_req_zone  $binary_remote_addr  zone=auth_ip:10m   rate=5r/s;

# Zona `global_ip` — proteje contra varredura agressiva no painel todo
# (uso opcional nos sites `app`/`ops` se precisar). Nao aplicado por
# padrao para nao impactar HMR do Next.js em staging.
limit_req_zone  $binary_remote_addr  zone=global_ip:10m rate=20r/s;

# HTTP 429 em vez do default 503 quando a cota estoura.
limit_req_status 429;
