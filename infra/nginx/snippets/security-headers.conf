# infra/nginx/snippets/security-headers.conf (INFRA-04)
#
# Security headers aplicados a respostas HTTPS. Inclua dentro do `server { }`
# das rotas servidas em 443.
#
# NOTA SOBRE HSTS: o cabecalho `Strict-Transport-Security` esta COMENTADO
# por padrao. So descomentar DEPOIS que o primeiro `certbot --nginx` tiver
# emitido certificados validos para todos os subdominios e um curl
# `https://<host>/` responder 200. Habilitar HSTS antes disso pode deixar
# navegadores presos a um host HTTPS quebrado. Ver `infra/nginx.md` secao 8.

# HSTS — descomentar apos validar HTTPS em TODOS os subdominios.
# `preload` NAO esta incluso de proposito: so adicionar depois do dominio
# comercial definitivo (SITE-* ainda bloqueado).
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Sem clickjacking.
add_header X-Frame-Options "DENY" always;

# Sem MIME-sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Referrer minimo.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissoes de APIs do browser — bloquear por padrao.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Proibir iframe cross-origin por padrao (complementa X-Frame-Options).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
