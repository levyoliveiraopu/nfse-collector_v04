# infra/nginx/snippets/tls.conf (INFRA-04)
#
# TLS moderno (Mozilla "intermediate", 2024). Compativel com todos os browsers
# suportados pelo painel SaaS. `certbot --nginx` injeta os paths de
# certificado/chave no server block — este snippet fica de fora da parte
# gerenciada pelo certbot para nao ser sobrescrito em renovacao.
#
# Uso: include dentro de cada `server { ... }` que escuta em 443.

# Protocolos e ciphers (Mozilla intermediate, sem TLS 1.0/1.1)
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# Sessions (performance)
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling (ativar apos primeiro cert emitido)
ssl_stapling        on;
ssl_stapling_verify on;
resolver            1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout    5s;

# Curve configuration
ssl_ecdh_curve      X25519:prime256v1:secp384r1;

# Parametros Diffie-Hellman (gerar no host — ver infra/nginx.md secao 5)
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;
