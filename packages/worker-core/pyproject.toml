[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "worker-core"
version = "0.1.0"
description = "Motor de coleta NFS-e ADN Nacional (autenticacao mTLS, fetcher, controle de NSU, Excel)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Levy Oliveira" },
]
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "pyOpenSSL>=24.0",
    "openpyxl>=3.1",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["worker_core"]

[tool.hatch.build.targets.sdist]
include = [
    "worker_core",
    "README.md",
    "pyproject.toml",
]
